<!doctype html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0d">
<title>OMKRY – Live Results</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    <span class="brand-icon">🍺</span>
    <div>
      <strong>OMKRY</strong>
      <small>BEER TASTING</small>
    </div>
  </div>

  <div class="top-actions">

    <span class="live-pill">
      <i></i> PÄIVITTYY LIVE
    </span>

    <a class="top-link" href="index.html">
      ⭐ Äänestyssivu
    </a>

  </div>

</header>

<main class="container results-page">

  <section class="hero center">

    <p class="eyebrow">REAL-TIME</p>

    <h1>Live Results</h1>

    <p>
      Tulokset päivittyvät automaattisesti jokaisen äänen jälkeen.
    </p>

  </section>


  <div class="result-columns">


    <section class="result-panel box-panel">

      <div class="section-title">

        <span>📦</span>

        <div>
          <h2>Laatikko-olut</h2>
          <small id="boxVotes">0 ääntä</small>
        </div>

      </div>

      <div id="boxPodium" class="podium"></div>

      <div id="boxRanking" class="ranking"></div>

    </section>


    <section class="result-panel tap-panel">

      <div class="section-title">

        <span>🍺</span>

        <div>
          <h2>Hanaolut</h2>
          <small id="tapVotes">0 ääntä</small>
        </div>

      </div>

      <div id="tapPodium" class="podium"></div>

      <div id="tapRanking" class="ranking"></div>

    </section>

  </div>

</main>


<div id="winnerModal" class="modal hidden">

  <div class="modal-backdrop"></div>

  <div id="winnerCard" class="winner-card">

    <button id="closeWinner" class="close">
      ×
    </button>

    <div id="winnerConfetti" class="confetti"></div>

    <div class="winner-icon">
      🏆
    </div>

    <div class="eyebrow">
      VOITTAJA
    </div>

    <div id="winnerCategory" class="winner-category"></div>

    <div id="winnerImage" class="winner-image"></div>

    <div id="winnerNumber" class="winner-number large"></div>

    <h2 id="winnerName"></h2>

    <div id="winnerScore" class="winner-score"></div>

    <div id="winnerVotes" class="winner-votes"></div>

  </div>

</div>


<script type="module" src="results.js"></script>

</body>
</html>
