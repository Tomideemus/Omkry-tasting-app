<!DOCTYPE html>
<html lang="fi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    OMKRY Live Results
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body class="results-body">


<header class="topbar">


  <div class="brand">


    <span class="brand-icon">

      🍺

    </span>


    <span class="brand-name">

      OMKRY

    </span>


    <span class="brand-subtitle">

      BEER TASTING

    </span>


  </div>



  <div class="live-status">


    <span class="live-dot">

      ●

    </span>


    PÄIVITTYY LIVE


  </div>


</header>



<main class="results-page">


  <div class="results-title">


    <h1>

      LIVE RESULTS

    </h1>


    <p>

      Tulokset päivittyvät reaaliajassa

    </p>


  </div>



  <div class="results-columns">


    <!-- LAATIKKO-OLUET -->


    <section class="results-category-card box-results-card">


      <div class="results-category-header">


        <h2>

          📦 LAATIKKOOLUET

        </h2>


        <span id="boxVoteCount">

          Yhteensä ääniä: 0

        </span>


      </div>



      <div

        id="boxPodium"

        class="podium"

      ></div>



      <div

        id="boxRanking"

        class="ranking-list"

      ></div>



      <button

        class="show-all-button box-button"

        id="showBoxWinner"

      >

        🏆 KATSO LAATIKKOVOITTAJA

      </button>


    </section>



    <!-- HANAOLUET -->


    <section class="results-category-card tap-results-card">


      <div class="results-category-header">


        <h2>

          🍺 HANAOLUET

        </h2>


        <span id="tapVoteCount">

          Yhteensä ääniä: 0

        </span>


      </div>



      <div

        id="tapPodium"

        class="podium"

      ></div>



      <div

        id="tapRanking"

        class="ranking-list"

      ></div>



      <button

        class="show-all-button tap-button"

        id="showTapWinner"

      >

        🏆 KATSO HANAVOITTAJA

      </button>


    </section>


  </div>



  <div class="winner-controls">


    <button

      id="showBothWinners"

      class="winner-main-button"

    >

      🏆 KATSO VOITTAJAT

    </button>


  </div>


</main>



<!-- VOITTAJA-ANIMAATIO -->


<div

  id="winnerModal"

  class="winner-modal"

>


  <div

    id="winnerBackground"

    class="winner-background"

  ></div>



  <button

    id="closeWinner"

    class="winner-close"

  >

    ✕

  </button>



  <div

    id="winnerContent"

    class="winner-content"

  >


    <div

      id="confetti"

      class="confetti-container"

    ></div>



    <div

      id="winnerCategory"

      class="winner-category"

    ></div>



    <h1>

      VOITTAJA!

    </h1>



    <div class="winner-laurels">

      🏆

    </div>



    <div

      id="winnerIcon"

      class="winner-icon"

    ></div>



    <div

      id="winnerName"

      class="winner-name"

    ></div>



    <div

      id="winnerScore"

      class="winner-score"

    ></div>



    <div

      id="winnerVotes"

      class="winner-votes"

    ></div>



    <button

      id="winnerNextButton"

      class="winner-next-button"

    >

      SULJE

    </button>


  </div>


</div>



<script

  type="module"

  src="results.js"

></script>


</body>

</html>
