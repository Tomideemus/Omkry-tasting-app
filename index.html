<!DOCTYPE html>
<html lang="fi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>OMKRY Beer Tasting</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="topbar">

  <div class="brand">

    <span class="brand-icon">
      🍺
    </span>

    <span class="brand-name">
      OMKRY
    </span>

    <span class="brand-subtitle">
      BEER TASTING
    </span>

  </div>


  <a
    href="results.html"
    class="live-results-button"
  >
    ◉ LIVE RESULTS
  </a>


</header>



<main class="voting-page">


  <section class="voting-intro">

    <h1>
      Arvostele oluet
    </h1>

    <p>
      Anna jokaiselle oluelle pisteet asteikolla 1–5.
    </p>

    <p class="voting-help">
      ☆ Harmaat tähdet = ei vielä arviota.
      ★ Keltaiset tähdet = antamasi pisteet.
    </p>

  </section>



  <!-- LAATIKKO-OLUET -->

  <section class="beer-category box-category">


    <div class="category-header">

      <h2>

        📦 LAATIKKOOLUET

        <span>
          (24 kpl)
        </span>

      </h2>

    </div>


    <div
      id="boxBeers"
      class="beer-grid"
    ></div>


  </section>



  <!-- HANAOLUET -->

  <section class="beer-category tap-category">


    <div class="category-header">

      <h2>

        🍺 HANAOLUET

        <span>
          (4 kpl)
        </span>

      </h2>

    </div>


    <div
      id="tapBeers"
      class="tap-grid"
    ></div>


  </section>



  <p class="change-info">

    ✓ Voit muuttaa antamaasi arviota milloin tahansa.

  </p>


</main>



<script
  type="module"
  src="app.js"
></script>


</body>

</html>
