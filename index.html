<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>OMKRY Beer Tasting</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <div class="logo">
    🍺 OMKRY
  </div>

  <div class="subtitle">
    BEER TASTING
  </div>

</header>


<main>

  <section class="intro">

    <h1>Arvostele oluet</h1>

    <p>
      Anna jokaiselle oluelle pisteet asteikolla 1–5.
    </p>

    <p class="small-text">
      Voit muuttaa antamaasi arviota myöhemmin.
    </p>

  </section>


  <!-- LAATIKKO-OLUET -->

  <section class="beer-section">

    <h2>
      📦 Laatikkooluet
    </h2>

    <p class="category-info">
      24 olutta – oma kilpailusarja
    </p>

    <div
      id="bottleBeers"
      class="beer-grid"
    ></div>

  </section>


  <!-- HANAOLUET -->

  <section class="beer-section tap-section">

    <h2>
      🍺 Hanaoluet
    </h2>

    <p class="category-info">
      4 olutta – oma kilpailusarja
    </p>

    <div
      id="tapBeers"
      class="beer-grid"
    ></div>

  </section>


</main>


<footer>

  🍺 OMKRY Beer Tasting

</footer>


<script
  type="module"
  src="app.js"
></script>

</body>
</html>
