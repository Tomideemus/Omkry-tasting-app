<!doctype html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0d">
<title>OMKRY Beer Tasting</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🍺</span>
    <div>
      <strong>OMKRY</strong>
      <small>BEER TASTING</small>
    </div>
  </div>

  <a class="top-link" href="results.html">
    📊 Tulokset
  </a>
</header>

<main class="container">

  <section class="hero">
    <div>
      <p class="eyebrow">OLUTTASTING</p>
      <h1>Arvostele oluet</h1>
      <p>
        Anna jokaiselle oluelle pisteet 1–5.
        Harmaat tähdet tarkoittavat, ettei olutta ole vielä arvioitu.
      </p>
    </div>

    <div class="live-pill">
      <i></i> LIVE
    </div>
  </section>

  <div id="loading" class="notice">
    Ladataan oluita…
  </div>

  <div id="error" class="notice error hidden"></div>

  <section id="boxSection" class="category box-category hidden">

    <div class="section-title">
      <span>📦</span>
      <div>
        <h2>Laatikko-oluet</h2>
        <small id="boxCount"></small>
      </div>
    </div>

    <div id="boxBeers" class="beer-grid"></div>

  </section>

  <section id="tapSection" class="category tap-category hidden">

    <div class="section-title">
      <span>🍺</span>
      <div>
        <h2>Hanaoluet</h2>
        <small id="tapCount"></small>
      </div>
    </div>

    <div id="tapBeers" class="beer-grid"></div>

  </section>

  <div id="emptyState" class="notice hidden">
    Oluita ei ole vielä lisätty.
    <a href="admin.html">Lisää oluet ylläpidosta</a>.
  </div>

</main>

<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>

</body>
</html>
